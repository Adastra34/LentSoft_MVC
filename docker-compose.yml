services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lentsoft-sqlserver
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserverdata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lentsoft-db-init
    restart: "no"
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    volumes:
      - ./db:/db:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        SQLCMD=/opt/mssql-tools18/bin/sqlcmd
        if [ ! -x "$$SQLCMD" ]; then SQLCMD=/opt/mssql-tools/bin/sqlcmd; fi
        "$$SQLCMD" -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "IF DB_ID('LentSoftDB') IS NULL CREATE DATABASE [LentSoftDB];"
        "$$SQLCMD" -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -d LentSoftDB -i /db/lentsoft-schema.sql

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lentsoft-web
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - UseSqlite=false
      - ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection}
      - PasswordResetJwt__SecretKey=${PasswordResetJwt__SecretKey}
      - PasswordResetJwt__Issuer=LentSoft.Web
      - PasswordResetJwt__Audience=LentSoft.PasswordReset
      - SaleConfirmationJwt__SecretKey=${SaleConfirmationJwt__SecretKey}
      - SaleConfirmationJwt__Issuer=LentSoft.Web
      - SaleConfirmationJwt__Audience=LentSoft.SaleConfirmation
      - MobileJwt__SecretKey=${MobileJwt__SecretKey}
      - MobileJwt__Issuer=LentSoft.Api
      - MobileJwt__Audience=LentSoft.Mobile
      - Gemini__ApiKey=${Gemini__ApiKey}
      - EmailSettings__SmtpServer=${EmailSettings__SmtpServer}
      - EmailSettings__SmtpPort=${EmailSettings__SmtpPort}
      - EmailSettings__SmtpUser=${EmailSettings__SmtpUser}
      - EmailSettings__SmtpPassword=${EmailSettings__SmtpPassword}
      - EmailSettings__FromEmail=${EmailSettings__FromEmail}
      - EmailSettings__FromName=${EmailSettings__FromName}

volumes:
  sqlserverdata:
